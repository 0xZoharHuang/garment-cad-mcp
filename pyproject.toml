[project]
name = "garment-cad-mcp"
version = "0.1.0"
description = "Transactional MCP and SDK facade for Valentina and GarmentCode"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.28,<1",
  "mcp>=1.13,<2",
  "pydantic>=2.11,<3",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
worker = ["fastapi>=0.116,<1", "python-multipart>=0.0.20,<1", "uvicorn>=0.35,<1"]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1"]

[project.scripts]
garmentcad = "garmentcad.cli:app"
valentina-mcp = "garmentcad.mcp.valentina:main"
garmentcode-mcp = "garmentcad.mcp.garmentcode:main"
garment-sim-worker = "garmentcad.worker.app:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garmentcad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
